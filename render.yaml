databases:
  - name: auth-db
    plan: free
    databaseName: auth_db
    user: postgres

services:
  - type: web
    name: campushub-auth-service
    runtime: docker
    plan: free
    envVars:
      - key: SERVER_PORT
        value: 8002
      - key: DB_HOST
        fromDatabase:
          name: auth-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: auth-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: auth-db
          property: database
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: auth-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: auth-db
          property: password
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        value: CampusHubSuperSecretKeyForJwtAuthentication2026MustBeLongEnough
      - key: JWT_EXPIRATION
        value: 86400000