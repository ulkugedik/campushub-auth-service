databases:
  - name: auth-db
    plan: free
    databaseName: auth_db
    user: postgres

services:
  - type: web
    name: campushub-auth-service
    runtime: docker
    plan: free
    envVars:
      - key: SERVER_PORT
        value: 8002
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: auth-db
          property: connectionString
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.postgresql.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: update
      - key: JWT_SECRET
        value: CampusHubSuperSecretKeyForJwtAuthentication2026MustBeLongEnough
      - key: JWT_EXPIRATION
        value: 86400000